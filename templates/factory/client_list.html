{% extends 'factory/base.html' %}
{% block title %}Клиенты{% endblock %}
{% block content %}
<h1>Клиенты</h1>
<form method="get">
    <input type="text" name="q" value="{{ q }}" placeholder="Поиск...">
    <button type="submit" class="btn">Найти</button>
</form>
<table>
    <tr><th>Код</th><th>Название</th><th>Город</th><th>Телефон</th><th>Email</th></tr>
    {% for c in clients %}
    <tr><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.city }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td></tr>
    {% empty %}<tr><td colspan="5">Нет клиентов</td></tr>
    {% endfor %}
</table>
{% endblock %}
