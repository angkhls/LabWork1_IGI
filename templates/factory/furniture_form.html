{% extends 'factory/base.html' %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="/furniture/" class="btn">Отмена</a>
</form>
{% endblock %}
